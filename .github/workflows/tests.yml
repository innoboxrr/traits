name: Tests

on:
    push:
        branches: [master]
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.2'
                      laravel: '^12.0'
                      testbench: '^10.0'
                    - php: '8.3'
                      laravel: '^12.0'
                      testbench: '^10.0'
                    - php: '8.3'
                      laravel: '^13.0'
                      testbench: '^11.0'
                    - php: '8.4'
                      laravel: '^13.0'
                      testbench: '^11.0'

        name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo, pdo_sqlite, sqlite3, mbstring
                  coverage: none

            # La matriz es el punto: el composer.json admite Laravel 12 y 13, y
            # hasta ahora no se comprobaba ninguno de los dos.
            - name: Instalar dependencias
              run: |
                  composer require --no-update --dev \
                      "laravel/framework:${{ matrix.laravel }}" \
                      "orchestra/testbench:${{ matrix.testbench }}"
                  composer update --prefer-dist --no-interaction --no-progress

            - name: Tests
              run: vendor/bin/phpunit --no-coverage
