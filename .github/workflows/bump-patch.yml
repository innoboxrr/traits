name: Bump Semantic Tag on Master

# Se dispara cuando TERMINAN los tests, no cuando se hace push.
#
# Antes colgaba directamente de `push`, y ademas el paquete no tenia tests: se
# publicaba un tag en cada commit, pasara lo que pasara. La comprobacion de
# `conclusion == success` de abajo es lo que impide que se despliegue nada que
# no este verde.
on:
    workflow_run:
        workflows: ['Tests']
        types: [completed]
        branches: [master]

jobs:
    bump-version:
        runs-on: ubuntu-latest

        # Solo si la suite paso. Sin esto, workflow_run se dispara tambien
        # cuando los tests fallan.
        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push'

        # Desde 2023 el GITHUB_TOKEN es de solo lectura por defecto. Sin esto el
        # push del tag falla con un 403 "Permission denied to
        # github-actions[bot]".
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  # El commit exacto que paso los tests, no la punta de master:
                  # entre medias puede haber entrado otro push.
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0 # Necesario para obtener todos los tags

            - name: Set up Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Get latest tag and bump version
              id: bump
              run: |
                  # El tag mas ALTO, no el mas reciente, y solo los que son
                  # semver de verdad. Con `--sort=-creatordate` bastaba un tag
                  # `v1.0.1` para que `IFS='.' read` dejara major='v1', que en
                  # aritmetica de bash vale 0: el siguiente #major habria
                  # publicado un 1.0.0 yendo hacia atras.
                  latestTag=$(git tag --list \
                      | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                      | sort -t. -k1,1n -k2,2n -k3,3n \
                      | tail -n 1)

                  if [ -z "$latestTag" ]; then
                      major=0
                      minor=0
                      patch=1
                  else
                      IFS='.' read -r major minor patch <<< "$latestTag"

                      commitMessage=$(git log -1 --pretty=%B)

                      # El marcador tiene que ir en su propia linea. Buscarlo
                      # en cualquier parte del texto significa que mencionarlo
                      # de pasada —"un commit #major sobre eso habria..."—
                      # dispara el salto de version. Es exactamente lo que paso
                      # al publicar innoboxrr/traits 2.0.0.
                      if echo "$commitMessage" | grep -qxE ' *#major *'; then
                          major=$((major + 1))
                          minor=0
                          patch=0
                      elif echo "$commitMessage" | grep -qxE ' *#minor *'; then
                          minor=$((minor + 1))
                          patch=0
                      else
                          patch=$((patch + 1))
                      fi
                  fi

                  newTag="$major.$minor.$patch"

                  if git rev-parse "$newTag" >/dev/null 2>&1; then
                      echo "El tag $newTag ya existe; no se hace nada."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "Nuevo tag: $newTag"
                      echo "new_tag=$newTag" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create and push tag
              if: steps.bump.outputs.skip != 'true'
              run: |
                  git tag ${{ steps.bump.outputs.new_tag }}
                  git push origin ${{ steps.bump.outputs.new_tag }}
